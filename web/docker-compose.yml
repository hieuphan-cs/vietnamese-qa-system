services:

  mysql_db_rag:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    container_name: mysql_db_rag
    restart: always
    env_file:
      - .env
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: backend_rag
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: >
      sh -c "python manage.py migrate &&
             python manage.py loaddata data.json &&
             python manage.py runserver 0.0.0.0:8000"
    depends_on:
      mysql_db_rag:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: frontend_rag
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
  
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin_rag
    restart: always
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=mysql_db_rag
      - PMA_PORT=3306
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    depends_on:
      - mysql_db_rag
  
  chromadb:
    image: chromadb/chroma:latest
    container_name: chroma_db_rag
    ports:
      - "8001:8000"
    volumes:
      - ./backend/chroma_data:/data

volumes:
  mysql_data:
  chroma_data: